verdict: Q-003 と Q-004 の答えへの合わせ方は、公開のリポジトリの無料の扱い（GitHub の billing の文書で確かめた）、下書きのリリースの見え方、FACT-rust の書き分け（前の SR-009 の直し方のとおり）とも合っている。残るのは、リポジトリを公開に切り替える人の手順が無く、今のリポジトリは非公開のままなので、001 の PR の CI（AC-ci-1）が非公開の枠で流れてしまうこと 1 件。
cycle: 1
findings:
  - id: SR-014
    target: spec
    where: _tech/architecture.md 275〜292（「開発環境と人が行う準備」の「人が一度だけ行うこと」）、308（費用：リポジトリは公開にする）、_tech/tech.yaml TECH-ci の summary、_tech/acceptance.yaml AC-ci-1、hearing/questions.yaml Q-003 の answer
    what: 仕様は「リポジトリは公開にする」を前提に、CI を Mac と Windows で毎回流すとしているが、誰がいつ公開に切り替えるかがどこにも書かれていない。リポジトリの公開は GitHub の設定で人が行うことで、「人が一度だけ行うこと」の表にも、CI の節にも無い。今のリポジトリは非公開（gh repo view の visibility が PRIVATE）。また、公開に切り替えると、今のファイルだけでなく git の履歴のすべて（specs/ の壁打ちのメモや問いの答え、.claude/ のハーネスの定義を含む）が誰からも見えるようになるが、そのことが人に見える所に書かれていない
    scene: 001 の PR を出すと、CI が非公開のリポジトリのまま Mac と Windows で流れ、Q-003 の background のとおり 1 回およそ 2 ドル分の無料の枠を使う。支払いの方法を登録していなければ、数回で枠を使い切って CI が流れなくなり、AC-ci-1 と AC-ci-2 を CI で確かめられない。あるいは、人が後で公開に切り替えたときに、履歴の中の壁打ちのメモなども公開されることを知らずに切り替える
    fix: architecture.md の「人が一度だけ行うこと」に、リポジトリを公開に切り替える手順を 1 行足し、いつ行うか（001 の PR で CI を流す前）と、切り替えると履歴を含むリポジトリのすべてのファイルが誰からも見えるようになることを書く。切り替えるのは人で、AI は行わない
