verdict: 往復が続いた根の原因は、指摘を直すときに、その指摘に答えるのに要る決め事を超えて、まだ答えの無い問い（Q-004、Q-003）の先や後のチケット（005、006）の細部まで土台に書き込み、それがほかの所とかみ合わなくなったこと（2 回目の SR-009 と SR-010、3 回目の SR-012 と SR-013）。3 回目の直しは、足した細部を消して 005 と 006 の計画に任せる 1 か所（architecture.md の「同期の受け持ち」の終わりの行）にまとめ、消した行の方が足した行より多い。今の仕様には、この根の原因から残る食い違いも、前の回から残る目的が崩れる指摘も無いので、指摘は 0 件にする。
