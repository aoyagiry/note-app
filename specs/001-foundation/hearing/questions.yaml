questions:
  - id: Q-001
    question: 比較のページで見た 3 つの案のうち、どの見た目でアプリを作りますか
    about: [_tech/design]
    background: ここで選んだ案の色、文字、間隔、角の丸み、動きの速さが、これから作るすべての画面の土台になります。どの案も明るい画面と暗い画面の両方があり、動きを減らす設定にも合わせてあります。後から別の案に替えると、それまでに作った画面の見た目をすべて描き直して確かめ直すことになります。案の細かい調整（色の濃さ、動きの長さなど）は、選んだ後でも直せます
    options:
      - { label: やわらかな遊び（砂色の地に浮かぶ丸い紙。押すと少し沈み、チェックやつまみが小さく弾む。背景に淡いにじみがゆっくり漂う）, effect: 「動かすだけで楽しく、思わず開きたくなる」にいちばん近く、押したときの手応えがはっきりあります。色は砂色と白に素焼きの橙を一点だけで、ぎらぎらしません。そのかわり、余白と丸みで一度に見える量は 3 案の中で最も少なく、弾む動きと漂う背景は長く使うと甘く感じることがあります。動きは 180〜260ms で 3 案の中で長めなので、ページを開くなどよく使う操作は短く詰めて作ります }
      - { label: くっきりした道具（白と灰を 1px の線で区切った作業の道具らしい画面。信号の緑を一点だけ使う）, effect: 動きは 60〜180ms で、押した瞬間に返り、3 案の中でいちばん速く感じます。保存した時刻や文字数、並びの子の数が常に見え、キーボードだけで探して開けます。そのかわり、情報と線が多く、ゆったり書く気分は出にくく、楽しさは見た目より速さと正確さから出す方向になります }
      - { label: 静かな紙（生成りの紙に墨で書くような面。見出しは明朝、藍を一点だけ使う）, effect: 長い文を落ち着いて書いて読み返すのに向き、夜に暗い画面で使っても目が疲れにくいです。そのかわり、一度に見える行とページの数が少なく、ボタンの形が控えめなので押せる所が分かりにくいことがあり、楽しさは手応えより静けさの側に寄ります }
    proposal: やわらかな遊び（砂色の地に浮かぶ丸い紙。押すと少し沈み、チェックやつまみが小さく弾む。背景に淡いにじみがゆっくり漂う）
    reason: 壁打ちで話された「動かすだけで楽しく、思わず開きたくなる」「手応えで楽しさを出す」「背景の動きは場面によってあってよい」に、3 案の中でいちばん合うためです。パソコンの幅では、左の並びと本文が浮いた 2 枚の面になり、余白が多めでも本文は十分な幅で読めます。スマホの幅（スマホは後で足す予定ですが、パソコンでウィンドウを細くしたときも同じ形になります）では、左の並びを隠して丸いメニューのボタンから開き、本文の面だけが残るので、どの案でも同じように使えます。ただ、3 案の中で一度に見える量がいちばん少ないので、ページが増えて一覧で見渡したくなったら、くっきりした道具が合います
    if_unsure: 提案のまま進めて大丈夫です。色の濃さ、動きの長さ、角の丸みなどは、画面を描くたびに見て直せます。別の案に丸ごと替えるのは、画面が少ないうち（最初のページの並びのチケットまで）なら手直しが小さく済みます
    answer: やわらかな遊びを元に遊びを足した「ひだまりの遊び」（sunlit-play。押すと沈む厚み、時刻で変わる背景のにじみ、線を引くように描かれる印、極太の見出し）。最初の答えは「やわらかな遊びが一番いいが、もっと遊びがあってもいい」で、遊びの強さを 3 段に分けた案を見比べて選んだ
    answered_at: 2026-11-11T04:30:51Z
  - id: Q-002
    question: 新しい版のアプリを自分の Mac と Windows に入れるとき、どうしたいですか
    about: [TICKET/008-start-using]
    background: 壁打ちで決めていなかった点です。版の印（タグ）を付けると Mac と Windows のアプリがビルドされることは決まっています。そこから自分の 2 台にどう入れるかで、使い始めるチケット（008）で作るものが変わります。自動のアップデートを付けるには、ビルドに署名の鍵を加え、新しい版を置いておく場所を用意します
    options:
      - { label: 自分の 2 台では、ビルドされたアプリを手で入れ直す。自動のアップデートは一般に配るときに足す, effect: 使い始めるまでに作るものが少なく済みます。そのかわり、新しい版を出すたびに、Mac と Windows の両方でダウンロードして入れ直す手間がかかります }
      - { label: 使い始めるとき（008）から、アプリが新しい版を見つけて自分で入れ替わるようにする, effect: 版の印を付けた後は、2 台とも次に開いたときに新しい版になり、入れ直す手間がありません。そのかわり、008 で署名の鍵と新しい版を置く場所の準備が足され、使い始めるまでが少し延びます }
    proposal: 自分の 2 台では、ビルドされたアプリを手で入れ直す。自動のアップデートは一般に配るときに足す
    reason: 最初に使うのはご自身一人で、版を出すタイミングもご自身で決めるので、入れ直す手間は小さいためです。配り方（無料、買い切り、月額）を決めるときに、新しい版の届け方も一緒に決められます
    if_unsure: 提案のまま進めて大丈夫です。自動のアップデートは、後のチケットで足せます。そのときは、すでに入っているアプリを一度だけ手で入れ直すことになります
    answer: 自分の 2 台では、ビルドされたアプリを手で入れ直す。自動のアップデートは一般に配るときに足す
    answered_at: 2026-11-10T10:02:11Z
  - id: Q-003
    question: PR を出したときと main にマージしたときに、Mac と Windows の両方ですべてのテストを流す確認（CI）を、どの機械で流しますか
    about: [_tech/TECH-ci]
    background: 000 で「すべてのテストを Windows と Mac の両方の機械で流して通す」と決めました。このリポジトリは非公開なので、GitHub の機械で流すと、無料で使えるのは月 12 ドル分までです。Mac の機械は 1 分 0.062 ドル、Windows は 0.010 ドルで、1 回の確認に Mac 約 25 分、Windows 約 30 分かかる見込みなので、1 回およそ 2 ドル、無料の分では月に 6 回ほどしか流せません。1 つのチケットで PR とマージの 2〜4 回流れるので、月に 2 つほどのチケットで無料の分を使い切ります。版の印を付けてアプリをビルドすると、さらに 1 回 1.5 ドルほどかかります。なお、GitHub の Mac と Windows の機械では Docker（Linux のもの）が動かないので、サーバーを使うテストが始まる 005 から、CI では Supabase の試し用のプロジェクト（無料の枠で 2 つまで作れるうちの 1 つ）を相手にすることになります
    options:
      - { label: GitHub の機械で毎回流し、無料の分を超えたら払う, effect: 手元のパソコンの状態によらず、いつでも同じきれいな環境で確認が流れます。作業の多い月は 20〜40 ドルほどかかる見込みです。GitHub に支払いの方法を登録し、使ってよい額の上限を決めておく準備が要ります。005 から、CI では Supabase の試し用のプロジェクトを使います }
      - { label: 自分の Mac と Windows を、CI を流す機械として GitHub につなぐ, effect: 費用はかかりません。Docker も使えるので、005 からも手元の開発と同じ形でサーバーのテストを流せます。そのかわり、2 台の電源が入っていて、待ち受けの仕組みが動いている間だけ確認が流れ、どちらかが止まっていると PR の確認がそのまま待ちます。流している間は、そのパソコンが重くなります }
      - { label: GitHub の機械で、Windows は毎回、Mac は main にマージしたときだけ流す, effect: Mac の分の費用がおよそ半分になります。そのかわり、Mac でだけ壊れたことは、マージした後に分かります（「両方で流して通す」を「Mac はマージの後に確かめる」に書き換えます） }
      - { label: 無料の分だけで流し、使い切ったら翌月まで待つ, effect: 費用はかかりません。そのかわり、使い切った月は CI が流れず、PR の確認とチケットの受け入れが翌月まで止まります }
    proposal: GitHub の機械で毎回流し、無料の分を超えたら払う
    reason: 費用の上限は無く、安い方がよいとのお話でした。2 台のパソコンの電源や状態に左右されず、いつでも確認が流れるのはこの案だけで、かかる額は作業の多い月でも数十ドルに収まる見込みです
    if_unsure: 提案のまま進めて大丈夫です。CI の流し方は設定のファイルだけで変えられるので、使ってみて額が気になったら、自分の 2 台をつなぐ形に後から切り替えられます
