questions:
  - id: Q-001
    question: 「メモ、予定、チケット、ToDo を 1 つにまとめる」という目的が実現できたと、何で判断しますか
    about: [_intent/GOAL-001]
    background: 実現できたかの目安が決まっていると、最初に作るメモの範囲で「どこまでできれば使い始められるか」を決めやすくなります。最初に使うのはご自身一人なので、ご自身の使い方で測るのが分かりやすいです
    options:
      - { label: 自分が日々のメモを、ほかのメモアプリを使わずにこのアプリだけで書いている, effect: ご自身の毎日の使い方で判断できます。そのかわり、ほかの人から見てよいかは、配るときに別に確かめることになります }
      - { label: 知り合い数人に使ってもらい、今使っているアプリより良いと言ってもらえる, effect: ご自身以外の目で確かめられます。そのかわり、共有やユーザー登録が無い最初の段階では、使ってもらう準備に手間がかかります }
      - { label: 一般に配り、決めた数の人が使い続けている, effect: 配る目的にいちばん近い目安です。そのかわり、配り方が決まるまで判断できません }
    proposal: 自分が日々のメモを、ほかのメモアプリを使わずにこのアプリだけで書いている
    reason: 最初はご自身一人で使うので、ご自身が乗り換えられたかがいちばん確かめやすく、ずれも少ないためです
    if_unsure: 提案のまま進めて大丈夫です。配る段になったら、目安を足せます
    answer: 自分が日々のメモを、ほかのメモアプリを使わずにこのアプリだけで書いている
    answered_at: 2026-11-10T09:13:36Z
  - id: Q-002
    question: 「見た目と品質で広告だらけの無料アプリと差をつける」が実現できたと、何で判断しますか
    about: [_intent/GOAL-003]
    background: 絶対の目標なので、できたかどうかを確かめる方法を決めておきます。速さの具体的な数（何秒以内に画面が変わるか、など）は、後半で共通の基準として別に問います
    options:
      - { label: 自分が毎日使っていて、ありがちな画面に見えず、操作して待たされたと感じる場面が無い, effect: チケットごとに、ご自身が画面を見て触って確かめられます。そのかわり、ご自身の感じ方に頼ります }
      - { label: 知り合い数人に見てもらい、有料のアプリと並べても見劣りしないと言ってもらえる, effect: ご自身以外の目で確かめられます。そのかわり、見てもらう手間がかかり、チケットごとには確かめにくいです }
      - { label: 参考にするアプリを決め、それと並べて見劣りしない, effect: 比べる相手がはっきりします。そのかわり、参考のアプリに見た目が寄りやすくなります }
    proposal: 自分が毎日使っていて、ありがちな画面に見えず、操作して待たされたと感じる場面が無い
    reason: 画面のあるチケットのたびに、ご自身が実際に触って確かめられる形にしておくと、品質が落ちたときにすぐ気付けるためです
    if_unsure: 提案のまま進めて大丈夫です。後から、知り合いに見てもらう確かめ方を足せます
    answer: 自分が毎日使っていて、ありがちな画面に見えず、操作して待たされたと感じる場面が無い
    answered_at: 2026-11-10T09:13:36Z
  - id: Q-003
    question: 最初に作るメモで、1 つのページに何を書けるようにしたいですか
    background: Notion のような使い心地とのお話でした。ページに書けるものの幅で、最初のメモのチケットの大きさと、文字を書く部分の作り方（後で変えにくい技術の選択）が変わります。あとで予定やチケットの見え方を足すときも、同じページの書き方を使います
    options:
      - { label: Notion のように、文字に加えて見出し、箇条書き、チェックボックス、リンクを行ごとに組める, effect: Notion に近い書き心地になり、ToDo の見え方を足すときにもチェックボックスが使えます。そのかわり、文字だけより最初のチケットで作るものが多くなります }
      - { label: 文字だけ（書式は Markdown の記号で書く）, effect: 最初のメモを早く使い始められます。そのかわり、見た目の洗練さを出しにくく、見出しや箇条書きの見え方は後から作り直しになります }
      - { label: 見出しや箇条書きに加えて、画像や表も最初から置ける, effect: 1 つのページでできることがいちばん多くなります。そのかわり、画像を同期するための仕組みも最初から要り、使い始めるまでが長くなります }
    proposal: Notion のように、文字に加えて見出し、箇条書き、チェックボックス、リンクを行ごとに組める
    reason: Notion のような使い心地というお話と、見た目で差をつける目標に合い、画像や表を後から足しても作り直しが少ないためです
    if_unsure: 提案のまま進めて大丈夫です。画像や表は後のチケットで足せます。文字だけで始めて後から変えると、書く部分を作り直すことになります
    answer: Notion のように、文字に加えて見出し、箇条書き、チェックボックス、リンクを行ごとに組める
    answered_at: 2026-11-10T09:13:36Z
  - id: Q-004
    question: ページが増えたとき、目当てのページをどうやって見つけたいですか
    widens: true
    background: ページを開くには、ページを並べて選ぶ場所が要ります。並べ方は、Notion のようにページの中にページを入れる形と、平らな一覧の形があり、最初のメモのチケットの範囲が変わります。言葉で探す検索は、お話に出ていなかったので、入れるかどうかも伺います
    options:
      - { label: Notion のように、ページの中にページを入れて、画面の左に木の形で並べる。言葉で探す検索も付ける, effect: 含めると、ページを入れ子にする操作、左の並び、検索の操作が範囲に足されます。ページが増えても整理して探せます。そのかわり、最初のメモのチケットで作るものが多くなります }
      - { label: 平らな一覧に新しい順で並べ、言葉で探す検索を付ける, effect: 含めると、ページの一覧と検索の操作が範囲に足されます。作るものは少なめです。そのかわり、ページを入れ子にして整理することはできません }
      - { label: 平らな一覧に新しい順で並べるだけ（検索は後で足す）, effect: 最初のメモを早く使い始められます。そのかわり、ページが増えると探しにくくなります }
    proposal: Notion のように、ページの中にページを入れて、画面の左に木の形で並べる。言葉で探す検索も付ける
    reason: メモ、予定、チケットを 1 つにまとめると、ページの数が早く増えるため、入れ子と検索の両方があると探しやすいからです
    if_unsure: 提案のまま進めて大丈夫です。検索は後のチケットに回すこともできます。平らな一覧で始めて後から入れ子にすると、すでにあるページの並べ直しが要ります
    answer: Notion のように、ページの中にページを入れて、画面の左に木の形で並べる。言葉で探す検索も付ける
    answered_at: 2026-11-10T09:13:36Z
  - id: Q-005
    question: ネットにつながっていない間に、Mac と Windows の両方で同じページを書き換えたとき、つながった後にどうなってほしいですか
    background: 壁打ちで決めていなかった点です。つながっていなくても書ける形なので、2 台で同じページを書き換えることが起こります。合わせ方で、同期の仕組み（後で変えにくい技術の選択）が変わります
    options:
      - { label: 両方の書き換えを、行や文字の単位で自動で合わせる, effect: 片方の変更が消えることがなく、人が何もしなくて済みます。そのかわり、同期の仕組みが複雑になり、同じ行を両方で書き換えたときは、両方の文が並んで残ることがあります }
      - { label: 後から同期した方を残し、前の方はページの履歴に残す, effect: 仕組みが簡単です。そのかわり、片方の書き換えが画面から消えるので、履歴を見て戻す手間がかかることがあります }
      - { label: 両方の版を残して知らせ、どちらを使うかを自分で選ぶ, effect: どちらの変更も失われません。そのかわり、そのたびに選ぶ手間がかかり、操作が気持ちよく進む目標とはぶつかりやすくなります }
    proposal: 両方の書き換えを、行や文字の単位で自動で合わせる
    reason: Mac と Windows の両方から手間なく使う目的に合い、選ぶ手間も、変更が消えることもないためです。後から共有を足すときにも、同じ仕組みで複数の人の書き換えを合わせられます
    if_unsure: 提案のまま進めて大丈夫です。後から合わせ方を変えると、同期の仕組みと保存しているデータの形を作り直すことになります
    answer: 両方の書き換えを、行や文字の単位で自動で合わせる
    answered_at: 2026-11-10T09:13:36Z
  - id: Q-006
    question: Windows と Mac のパソコンのほかに、スマートフォンやブラウザからもページを見たいですか
    widens: true
    background: お話では Windows と Mac のデスクトップアプリでした。ほかの機器からも見たい場合、最初から作らなくても、いずれ足すかどうかで、データの持ち方やサーバーの作りの選び方が変わります
    options:
      - { label: Windows と Mac のパソコンだけにする, effect: 作るものがいちばん少なく、パソコンの使い心地に集中できます。そのかわり、外出先でスマートフォンから見ることはできません }
      - { label: 今はパソコンだけで作り、スマートフォンは後のチケットに置く, effect: 含めると、スマートフォンで見る操作が後で足す範囲に入ります。最初に作るものは変わらず、後から足せるようにサーバーの作りを選びます。そのかわり、技術の選び方に少し制約が付きます }
      - { label: ブラウザからも見られるようにし、後のチケットに置く, effect: 含めると、ブラウザで見る操作が後で足す範囲に入ります。どの機器からでも見られます。そのかわり、技術の選び方に少し制約が付きます }
    proposal: Windows と Mac のパソコンだけにする
    reason: お話はデスクトップアプリで、見た目と速さの品質に集中するには、作る機器を絞るのがよいためです
    if_unsure: 提案のまま進めて大丈夫です。あとで足したくなったら、新しいチケットとして足せます。ただし、サーバーの作りによっては足すときの手間が増えます
    answer: 今はパソコンだけで作り、スマートフォンは後のチケットに置く
    answered_at: 2026-11-10T09:13:36Z
  - id: Q-007
    question: 配り方（無料、買い切り、月額）と広告を入れるかどうかは、いつ決めますか
    background: 壁打ちで決めていなかった点です。最初はご自身一人で使うので、今決めなくても作り始められます。決めた配り方によって、料金の仕組みのチケットの中身が変わります
    options:
      - { label: 今は決めず、一般に配る前に決める, effect: 今はメモ作りに集中できます。料金の仕組みは、決めるまで範囲の外に置いたままにします。そのかわり、配る前にもう一度相談が要ります }
      - { label: 今決める（配り方と広告の有無を教えてください）, effect: 料金の仕組みのチケットを、最初から一覧に並べられます。そのかわり、使ってみる前に決めることになります }
    proposal: 今は決めず、一般に配る前に決める
    reason: 最初はご自身一人で使い、料金の仕組みも後のチケットなので、使ってみてから決めても手戻りが無いためです
    if_unsure: 提案のまま進めて大丈夫です
    answer: 今は決めず、一般に配る前に決める
    answered_at: 2026-11-10T09:13:36Z
  - id: Q-008
    question: 見た目や使い心地の参考にしたいアプリや資料はありますか
    background: 洗練された見た目と気持ちのよい反応が絶対の目標なので、手本があると、画面のモックを描くときに方向を合わせやすくなります。画面の写しや資料があれば、specs/_references に置いていただくと読みます
    options:
      - { label: 特に無い（AI がありがちでない方向をいくつか描いて見せる）, effect: 画面のモックを描く段で、方向の違う案を見て選べます。そのかわり、選ぶまでに一度やり取りが要ります }
      - { label: ある（アプリの名前を挙げるか、資料を specs/_references に置く）, effect: 最初のモックから方向を合わせやすくなります }
    proposal: ある（アプリの名前を挙げるか、資料を specs/_references に置く）
    reason: Notion のような使い心地とのお話があったので、ほかにも好きなアプリがあれば、それを手本にするのがいちばん早く方向が合うためです
    if_unsure: 特に無いとして進めて大丈夫です。画面のモックを見てから、手本を挙げていただいても構いません
    answer: 特に無い（AI がありがちでない方向をいくつか描いて見せる）
    answered_at: 2026-11-10T09:13:36Z
