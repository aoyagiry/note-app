  - id: Q-013
    question: 一方のパソコンで書いたことが、もう一方のパソコンに出るまで、どのくらい待てますか
    about: [_shared/NFR-sync-delay]
    background: 両方のパソコンでアプリを開いているときの話です。数秒以内に出すなら、サーバーから知らせを送り続ける仕組みが要り、アプリを開いたときに揃っていればよいなら、開いたときと決まった間隔で取りに行く仕組みで足ります。同期の仕組みは後で変えにくい技術の選択なので、先に伺います
    options:
      - { label: 両方つながっていれば、3 秒以内に出る, effect: 2 台を並べて使っても、すぐに揃います。後で共有を足したときにも、ほかの人の書き換えがすぐに見えます。そのかわり、サーバーと同期の仕組みが少し複雑になります }
      - { label: 1 分以内に出ればよい, effect: 仕組みが簡単になります。そのかわり、2 台を並べて使うと、揃うまでに待つことがあります }
      - { label: もう一方のパソコンでアプリを開いたときに揃っていればよい, effect: 仕組みがいちばん簡単です。そのかわり、開いたままのパソコンには、もう一方の書き換えが出ません }
    proposal: 両方つながっていれば、3 秒以内に出る
    reason: Mac と Windows の両方を手間なく使う目的と、後で足す共有に合うためです
    if_unsure: 提案のまま進めて大丈夫です。後から速く出るように変えると、同期の仕組みを作り直すことになります
    answer: 両方つながっていれば、3 秒以内に出る
    answered_at: 2026-11-10T09:31:23Z
  - id: Q-014
    question: 使っているライブラリに既知の脆弱性が見つかったとき、どの深刻度まで残してよいですか
    about: [_shared/NFR-vulnerabilities]
    background: アプリとサーバーは、外のライブラリを使って作ります。ライブラリには、後から脆弱性（悪用されうる弱点）が見つかることがあり、深刻度は低い、中くらい、高い（High）、重大（Critical）に分けて公表されます。どこまでを直してから進めるかで、チケットごとの確認の手間が変わります。いずれ一般に配り、人のデータを預かる前提です
    options:
      - { label: 高い（High）と重大（Critical）は残さない, effect: 悪用されやすい弱点を残さずに進められます。そのかわり、見つかるたびに、ライブラリの版を上げるか取り替える手間がかかります }
      - { label: 重大（Critical）だけは残さない, effect: 手間が少なくなります。そのかわり、高い深刻度の弱点が残ることがあります }
      - { label: 既知の脆弱性を 1 つも残さない, effect: いちばん安全です。そのかわり、影響の小さい弱点でも直すまで進めず、手間が大きくなります }
      - { label: 特に基準は決めない, effect: 確認の手間がかかりません。そのかわり、データを預かるサーバーに弱点が残ったまま配ることがあります }
    proposal: 高い（High）と重大（Critical）は残さない
    reason: いずれ一般に配り、人のデータを預かるので、悪用されやすい弱点は残さず、影響の小さいものには手間をかけない釣り合いが取れるためです
    if_unsure: 提案のまま進めて大丈夫です。配る前に、基準を厳しくすることもできます
    answer: 高い（High）と重大（Critical）は残さない
    answered_at: 2026-11-10T09:31:23Z
