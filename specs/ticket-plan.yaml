tickets:
  - id: 002-page-tree
    title: ページを作って左の並びから開く
    purpose: 自分が、ページを作って名前を付け、ページの中にページを入れて整理し、画面の左に木の形で並んだページから目当てのページを開ける
    scope:
      includes:
        - 自分が、ページを作り、名前を付ける
        - 自分が、ページの中にページを入れ、画面の左に木の形で並んだページから開く（並べ替えや、別のページの中へ移す操作をどこまで作るかは、このチケットのヒアリングで決める）
        - 自分が、ページを消す（中にページが入っているページを消したときにどうなるか、消したページを戻せるかは、このチケットのヒアリングで決める）
        - 自分が、アプリの中で明るい画面と暗い画面を切り替える。最初は端末（Mac や Windows）の設定に合わせて開き、アプリの中で選んだら、その後は選んだほうで開く
      excludes:
        - ページの本文を書くこと（003-page-editor で作る）
        - ほかのパソコンとの同期（006-page-sync で作る）
    depends_on: []
  - id: 003-page-editor
    title: ページの本文を書く
    purpose: 自分が、Notion のように、文字に加えて見出し、箇条書き、チェックボックス、リンクを行ごとに組んで、ページの本文を書ける
    scope:
      includes:
        - 自分が、ページを開いて本文を書く。文字に加えて、見出し、箇条書き、チェックボックス、リンクを行ごとに組める（行の種類の切り替え方、リンクの先にほかのページを選べるか、書いたことが保存されたと分かる見せ方は、このチケットのヒアリングで決める）
      excludes:
        - 画像や表を置くこと
        - ページに日付や状態などの項目を付けること（後で足す）
    depends_on: [002-page-tree]
  - id: 004-page-search
    title: 言葉でページを探す
    purpose: ページが増えても、自分が言葉で検索して目当てのページを開ける
    scope:
      includes:
        - 自分が、言葉でページを検索し、結果から開く（名前だけを探すか本文も探すか、結果の並べ方は、このチケットのヒアリングで決める）
      excludes: []
    depends_on: [003-page-editor]
  - id: 005-account-login
    title: 同じアカウントで Mac と Windows にログインする
    purpose: 自分が、データを預かるサーバーのアカウントで、Mac と Windows のアプリにログインできる
    scope:
      includes:
        - 自分が、同じアカウントで Mac と Windows のアプリにログインする（ユーザー登録の画面は作らないので、自分のアカウントをどう用意するか、ログアウトを作るかは、このチケットのヒアリングで決める）
      excludes:
        - ユーザー登録の画面と、パスワードを忘れたときの手続き（後で足す）
    depends_on: []
  - id: 006-page-sync
    title: 2 台のパソコンでページを同期する
    purpose: 同じアカウントでログインした Mac と Windows で、同じページを手間なく見て書ける。ネットにつながっていない間に書いたことも、つながったら自動で同期される
    scope:
      includes:
        - 自分が、ページをサーバーに預け、同じアカウントでログインしたもう一方のパソコンで、同じページ（入れ子の並びも含む）を見て書く（ログインする前に書いていたページの扱い、同期の様子をどう見せるかは、このチケットのヒアリングで決める）
        - 自分が、ネットにつながっていない間もページを読み書きし、つながったら自動で同期される
        - ネットにつながっていない間に 2 台で同じページを書き換えたときは、両方の書き換えが行や文字の単位で自動で合わさる
        - 別の人が自分のアカウントでログインしても、こちらのページは見えない
      excludes:
        - ほかの人とのページの共有（後で足す）
    depends_on: [004-page-search, 005-account-login]
  - id: 007-two-devices-journey
    title: Mac と Windows で同じページを使う流れを確かめる
    purpose: Mac でログインしてメモを書き、Windows でログインして同じメモを見て書き足す、という一続きの使い方が、ページ、アカウント、同期をまたいで通ることを確かめる
    scope:
      includes:
        - 自分が、Mac でログインしてページを書き、後で Windows でログインすると、同じページが見えて書き足せる
        - 自分が、ネットにつながっていない Windows でページを書き、つながると Mac でも見える
      excludes: []
    depends_on: [006-page-sync]
  - id: 008-start-using
    title: 自分の Mac と Windows で使い始める
    purpose: 作ったアプリを自分の Mac と Windows に入れ、データを預かるサーバーを動かして、日々のメモをこのアプリだけで書き始められる
    scope:
      includes:
        - 自分が、Mac と Windows にアプリを入れて起動し、ログインして使い始める
        - データを預かるサーバーを、2 台のパソコンからネットを通して使える所で動かす
        - 自分が、版の印を付けてビルドされた新しい版のアプリを、Mac と Windows に自分で入れ直す
      excludes:
        - 一般の人への配布（配り方を決めてから足す）
        - アプリが新しい版を見つけて自分で入れ替わること（自動のアップデート。一般に配るときに足す）
    depends_on: [007-two-devices-journey]
    release: true
later:
  - id: page-properties
    title: ページに日付や状態などの項目を付ける
    reason: 最初はメモから作ると決めたため。カレンダー、チケットのボード、ToDo の一覧の見え方の土台になるので、見え方を足すときに最初に切り出す
  - id: calendar-view
    title: ページをカレンダーで並べて見る
    reason: メモの後に順に足すと決めたため。日付の項目（page-properties）の後に作る
  - id: board-view
    title: ページをチケットのボードで並べて見る
    reason: メモの後に順に足すと決めたため。状態の項目（page-properties）の後に作る
  - id: todo-view
    title: ページを ToDo の一覧で並べて見る
    reason: メモの後に順に足すと決めたため。項目（page-properties）の後に作る
  - id: phone-view
    title: スマートフォンからページを見る
    reason: 今はパソコンだけで作り、スマートフォンは後で足すと決めたため
  - id: sign-up-and-password-reset
    title: ユーザー登録の画面と、パスワードを忘れたときの手続き
    reason: 最初は自分一人で使うので、一般に配るときに足すため
  - id: page-sharing
    title: ほかの人とページを共有する
    reason: 最初は自分一人で使い、共有は後で足すと決めたため
  - id: pricing
    title: 料金の仕組み
    reason: 配り方（無料、買い切り、月額）と広告を入れるかを、一般に配る前に決めてから足すため
  - id: public-distribution
    title: 一般の人にアプリを配る
    reason: いずれ一般に配るが、最初は自分一人で使うため。入れ方や新しい版の届け方は、配り方（無料、買い切り、月額）を決めてから足す
  - id: page-images-and-tables
    title: ページに画像や表を置く
    reason: 最初の本文は、文字、見出し、箇条書き、チェックボックス、リンクにすると決めたため。画像や表は後のチケットで足す
