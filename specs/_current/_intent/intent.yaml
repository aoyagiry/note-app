goals:
  - id: GOAL-001
    statement: メモ、予定、チケット、ToDo を 1 つにまとめて扱える、万能のデスクトップアプリを作る。すべてを「ページ」として持ち、日付や状態などの項目を付けると、同じページをカレンダー、チケットのボード、ToDo の一覧という見え方で並べられる。最初はメモから作り、ほかの見え方や便利な機能は後から順に足す
    success: 自分が日々のメモを、ほかのメモアプリを使わずにこのアプリだけで書いている（Mac と Windows の両方で）
  - id: GOAL-002
    statement: Mac と Windows の両方で、同じアカウントでログインしていれば、同じページを手間なく見て書ける。ネットにつながっていなくても読み書きでき、つながったら自動で同期する
    success: Mac で書いたメモを、後で Windows でアプリを開くと、書き出しや取り込みをしなくてもそのまま見える。ネットにつながっていない間に書いたメモも、つながった後にもう一方のパソコンで見える
  - id: GOAL-003
    statement: 見た目と使い心地で、安っぽい広告だらけの無料アプリとはっきり差をつける（絶対の目標）。画面は洗練されていて、AI がよく作るありがちな画面（紫から青へのグラデーション、どこにでもある絵文字のアイコン、同じ形のカードを並べただけの配置、中身の無い飾りの言葉など）にしない。ページを開く、文字を打つ、ボタンを押すと、待たされたと感じさせずに画面が変わり、済んだことがさりげなく分かる
    success: 自分が毎日使っていて、ありがちな画面に見えず、操作して待たされたと感じる場面が無い
  - id: GOAL-004
    statement: いずれ一般に配れるように、最初からログイン、データを預かるサーバー、ほかの人のページが見えないこと、通信の暗号化を備える
    success: 別の人が自分のアカウントでログインしても、こちらのページは見えない。パソコンとサーバーの間の通信が暗号化されている
facts:
  - id: FACT-platforms
    statement: アプリは Windows と Mac のパソコンで動かす
  - id: FACT-rust
    statement: アプリの処理の中心とデータは Rust で作り、画面は Web の技術（TypeScript）で描く（人の指定。速さを大事にするため）
  - id: FACT-single-user-first
    statement: 最初に使うのは自分一人。ほかの人との共有は後で足す
  - id: FACT-no-design-reference
    statement: 見た目や使い心地の手本にするアプリや資料は無い。画面の方向は、AI がありがちでない方向の案をいくつか描き、見比べて選ぶ
users:
  - name: 自分
    description: このアプリを作って使う本人。Mac と Windows の両方のパソコンで、同じアカウントでログインしてメモを書き、見る。いずれは一般の人にも配る
scope:
  includes:
    - 自分が、同じアカウントで Mac と Windows のアプリにログインする
    - 自分が、メモのページを作り、書き、開き、消す。ページには、文字に加えて見出し、箇条書き、チェックボックス、リンクを行ごとに組める
    - 自分が、ページの中にページを入れて整理し、画面の左に木の形で並んだページから開く
    - 自分が、言葉でページを検索して開く
    - 自分が、ネットにつながっていなくてもページを読み書きし、つながったら自動で同期されて、もう一方のパソコンでも同じページを見る。つながっていない間に 2 台で同じページを書き換えたときは、両方の書き換えが行や文字の単位で自動で合わさる
    - 自分が、スマートフォンからページを見る（後で足す）
    - 自分が、ページに日付や状態などの項目を付け、カレンダー、チケットのボード、ToDo の一覧の見え方で並べて見る（メモの後に順に足す）
    - ユーザー登録の画面と、パスワードを忘れたときの手続き（後で足す）
    - ほかの人とのページの共有（後で足す）
    - 料金の仕組み（配り方と広告を入れるかを、一般に配る前に決めてから足す）
  excludes:
    - 野球に関する機能（アプリは野球と関係ない）
