rules:
  - id: RULE-works-offline
    statement: ページを作る、開く、書く、消す、探すといったページの操作は、ネットにつながっていなくても、つながっているときと同じようにできる。つながっていない間にしたことは、つながったら自動でサーバーと同期され、ログインしているもう一方のパソコンにも届く
  - id: RULE-merge-edits
    statement: 2 台のパソコンで同じページを書き換えたとき（ネットにつながっていない間の書き換えを含む）は、両方の書き換えが行や文字の単位で自動で合わさる。どちらかの書き換えが消えることはなく、どちらを残すかを人が選ぶ必要もない
  - id: RULE-own-pages-only
    statement: ログインしている人に見えて、書けるのは、その人のアカウントのページだけである。別の人が自分のアカウントでログインしても、こちらのページは一覧にも検索の結果にも出ず、開くこともできない
