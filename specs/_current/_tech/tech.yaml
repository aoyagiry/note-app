tech:
  - id: TECH-app-platform
    summary: アプリは Rust と Tauri 2 で作り、画面は Web の技術（HTML と CSS）で、OS の WebView（Windows は WebView2、Mac は WKWebView）に描く。ページの保存、検索、同期などの処理は Rust で書く
    decision: Rust（stable）と Tauri 2。処理の中心は Rust の crate（crates/core）に置き、Tauri のアプリ（apps/desktop/src-tauri）がそれをコマンドとして画面に渡す。画面は TypeScript で書き、OS の WebView で描く
    reason: Rust で作るという指定（FACT-rust）を処理の側で守りつつ、選んだ見た目（ひだまりの遊び。CSS の変数と HTML で描かれている）をそのまま写せるため。Notion のような本文の編集は、Web の技術に成熟した部品があり、一から作らずに済む。アプリの大きさが小さく、起動が速い
    background: 壁打ちで「アプリの画面の作り方（Rust だけで描くか、Web の技術と組み合わせるか）」を決めていませんでした。この選び方で、選んだ見た目をどう写すか、本文の編集をどう作るか、画面をどう試すかが決まります。この選択では、画面の部分は Rust ではなく TypeScript で書きます。Mac の画面は Safari と同じ仕組み（WebKit）で、Windows の画面は Edge と同じ仕組み（Chromium）で描かれるので、両方で見え方を確かめます
    alternatives:
      - { option: Rust だけで描く（egui、iced、Slint、GPUI など）, effect: 見た目と本文の編集を一から作ることになる }
      - { option: Rust で画面も書き、WebView で描く（Dioxus、Leptos）, effect: 本文の編集の部品が乏しく、作る量が多い }
      - { option: Electron, effect: Rust で作る指定に合わず、重く起動も遅い }
    if_changed: 画面をすべて作り直します。Rust の処理（crates/core）はそのまま使えます
    sources:
      - https://github.com/tauri-apps/tauri-docs/blob/v2/src/content/docs/concept/process-model.md
      - https://github.com/tauri-apps/tauri-docs/blob/v2/src/content/docs/reference/webview-versions.md
  - id: TECH-ui-framework
    summary: 画面は React と TypeScript で書き、Vite でビルドする。見た目は CSS Modules と、デザインシステムと同じ名前の CSS の変数だけで指定する
    decision: React（19 系）、TypeScript、Vite。CSS は CSS Modules と CSS の変数（apps/desktop/src/styles/tokens.css）。本文の編集の部品は 003 で選ぶ（ProseMirror の系統を前提にし、Yjs と組み合わせる）
    reason: 本文の編集、木の形の並び、長い一覧を少しずつ描く部品など、作るものに要る部品と情報がいちばん揃っているため。文字を打つ処理は本文の編集の部品が React の外で行うので、キーを打ってから文字が出るまでの速さ（NFR-response-time）に React は効かない
    background: 画面を組み立てる道具の選び方で、作れる部品と、作る役が迷わずに書けるかが変わります。すべての画面がこの道具の上に乗ります
    alternatives:
      - { option: Svelte, effect: 本文の編集と木の部品の選択肢が少ない }
      - { option: SolidJS, effect: 速いが部品と情報が少なく、作る量が増える }
      - { option: Vue, effect: 本文の編集と Yjs の組み合わせの例が少ない }
    if_changed: すべての画面と、画面の単体テストを書き直します。e2e のテストと Rust の処理はそのまま使えます
  - id: TECH-local-data
    summary: ページはパソコンの中の SQLite に保存し、ページの中身と並びは Yjs の形（CRDT。Rust では yrs）で持つ。ネットにつながっていなくても、すべての操作はパソコンの中のデータに対して行う
    decision: SQLite（rusqlite の bundled。Mac と Windows で同じ版）を、アプリのデータの置き場所（Tauri の app_data_dir）に置く。ページの本文と、ページの並び（親子と順番、名前）は Yjs の文書として保存し、更新の差分も残す。サーバーには、この差分を預ける（006）。表の形は rusqlite_migration で起動のときに合わせる。検索の索引の作り方は 004 で決める
    reason: 2 台で同じページを書き換えたとき、両方の書き換えを行や文字の単位で自動で合わせる（RULE-merge-edits）には、書き換えを差分として持ち、どの順に届いても同じ結果になる仕組み（CRDT）が要るため。Yjs は本文の編集の部品との組み合わせ（y-prosemirror）があり、Rust の yrs と同じ形でやり取りできる。パソコンの中に保存するので、つながっていなくても読み書きできる（RULE-works-offline）
    background: ページをどんな形で保存するかで、つながっていない間に書いたものの合わせ方と、同期の仕組みが決まります。000 で、両方の書き換えを行や文字の単位で自動で合わせると決めました
    alternatives:
      - { option: ふつうの表に保存し、後から書いた方を残す, effect: 文字の単位で合わせられない }
      - { option: Automerge, effect: 本文の編集の部品との組み合わせが少ない }
      - { option: Loro, effect: 新しく、長く使った実績が少ない }
    if_changed: 保存したページを新しい形に移し替える処理と、同期の仕組みと、本文の編集のつなぎを作り直します
    sources:
      - https://github.com/y-crdt/y-crdt
  - id: TECH-server
    summary: データを預かるサーバーは Supabase（データベース、ログイン、変更の知らせ、サーバーの処理を運用まで任せられるサービス）を使う。手元では Supabase の CLI で Docker の上に同じものを起こす。使い始めるのは 005 から
    decision: Supabase（Postgres、Auth、Realtime、Edge Functions）。手元の開発は Supabase の CLI（supabase start。Docker で動く）。ほかの人のページが見えないことは、Postgres の行ごとの制限（Row Level Security）で守る。パスワードは Supabase Auth が bcrypt でハッシュにして保存する（NFR-password-storage）。サーバーの定義（表の移し替え、サーバーの処理）は supabase/ に置く。本番のプロジェクトとデプロイは 008 で決める
    reason: フルマネージドの希望に合い、データベース、ログイン、変更の知らせが 1 つのサービスにまとまっていて、手元でも Docker で同じものを動かせるため。費用は、無料の枠（データベース 500 MB、プロジェクト 2 つ、使う人 5 万人まで）で、自分一人で使う間は足りる見込み。無料の枠のプロジェクトは 1 週間使わないと止まるので、使い始める 008 で、止まらない有料の枠（月 25 ドルから）にするかを決める
    background: 壁打ちで「どのフルマネージドのサービスにするか」を決めていませんでした。ログイン（005）と同期（006）の作りが、このサービスの上に乗ります
    alternatives:
      - { option: Firebase, effect: 手元で Docker で動かせず、行ごとの制限の書き方が独自 }
      - { option: AWS（Cognito、AppSync、DynamoDB など）, effect: 組み合わせる部品が多く、手元で動かしにくい }
      - { option: GCP（Cloud Run、Cloud SQL など）, effect: データベースが常に課金され、安くならない }
      - { option: Cloudflare（Durable Objects、D1）, effect: ログインの仕組みを自分で作ることになる }
    if_changed: ログインと同期のサーバー側とアプリの同期の処理を作り直し、預けたページを新しいサービスへ移します。パソコンの中のデータの形（TECH-local-data）はそのまま使えます
    sources:
      - https://supabase.com/pricing
      - https://github.com/supabase/auth
  - id: TECH-errors
    summary: 失敗は、決まった種類（見つからない、断られる、ほかと重なる、権限が無い、ログインしていない、想定外）と理由の符号だけで返し、画面が符号に当たる文を画面文の一覧から引いて出す。想定外の失敗では、中身を一切返さず、記録だけに残す
    decision: 'コマンドの失敗は { "kind", "reason" } の形（kind は not_found、rejected、conflict、forbidden、unauthenticated、internal のどれか。reason は snake_case の理由の符号）。試す場とサーバーの HTTP では kind を状態コードに写す（architecture.md の「仕様の結果の写し方」）。想定外の失敗と panic は { "kind": "internal", "reason": "internal" } にし、詳細はパソコンの中の記録（tracing）に書く'
    reason: 失敗の理由ごとに画面の文を分けられ、文の直しがコードに及ばない。サーバーの内部の情報を返さない（NFR-error-details）
    background: 失敗をどう返し、どう画面に出すかを、すべての操作で揃えます。後から変えると、すべての操作の失敗の扱いと、そのテストを直すことになります
    alternatives:
      - { option: 例外の文をそのまま返す, effect: 内部の情報が画面に出る（NFR-error-details） }
      - { option: 画面に出す文をサーバーが返す, effect: 文の直しのたびに処理を直すことになる }
    if_changed: すべての操作の失敗の返し方と、画面の失敗の出し方と、そのテストを直します
  - id: TECH-monorepo
    summary: アプリ、試す場、サーバーの定義、両方が使うデータの形を、このリポジトリ 1 つにまとめる（モノレポ）。Rust は Cargo の workspace、JavaScript の依存はリポジトリの直下の package.json 1 つで持つ
    decision: Cargo の workspace（依存の版は直下の Cargo.toml の workspace.dependencies にまとめ、各 crate は workspace = true で使う）。npm の依存は直下の package.json だけに書き、npm の workspaces は使わない
  - id: TECH-dev-host
    summary: 試す場（devhost）を Rust で作る。アプリと同じコマンドの処理を HTTP で受け、ビルドした画面を配る。e2e、API のテスト、人がブラウザで画面を開くときに使う
    decision: axum の小さなサーバー（crates/devhost）。画面は Tauri の invoke の代わりに HTTP でコマンドを呼ぶ（apps/desktop/src/bridge が切り替える）。コマンドの処理と失敗の写し方は Tauri と同じもの（crates/commands）を使う。テストのための受け口（時計、データの分け方、わざと失敗させるコマンド）は e2e の feature でビルドしたときだけ入る
    reason: Mac の WKWebView は Playwright で操作できないため、同じ処理を HTTP でつなぎ、ブラウザで画面と処理のつなぎ目まで確かめる。人もブラウザで開いて試せる
  - id: TECH-test-tools
    summary: テストは、画面の部品の単体テストと API のテストを Vitest、e2e を Playwright（Chromium のパソコンの幅とスマホの幅、Mac の画面に近い WebKit のパソコンの幅）、Rust の中のテストを cargo-nextest で流す。結果はすべて JUnit XML で reports/junit/ に出す
    decision: Vitest（projects：unit、api、foundation）、Playwright（projects：desktop、phone、webkit）、cargo-nextest。具体例のテストは TypeScript のファイル（*.test.ts、*.spec.ts）に書く（ハーネスは Rust のファイルの中の具体例の ID を数えないため）
  - id: TECH-coverage
    summary: カバレッジは、TypeScript を Vitest（v8）で、Rust を cargo-llvm-cov で測る。Rust は、API のテストが呼んだ試す場の処理も含めて測る
    decision: npm run coverage が、cargo llvm-cov show-env の環境で試す場をビルドし、Vitest の unit と api を v8 のカバレッジ付きで流し、cargo nextest を流してから、両方の報告を coverage/ に出す。起動の処理、設定、生成した型、Tauri の窓の組み立ては除く
  - id: TECH-lint
    summary: 書き方の決まりは lint の道具（ESLint、Prettier、rustfmt、clippy）で確かめる。git の hook は使わない
    decision: ESLint（typescript-eslint、react-hooks）と Prettier の check、cargo fmt --check、cargo clippy -D warnings を npm run lint で流す
  - id: TECH-audit
    summary: 脆弱性の検査は npm audit（High 以上で落とす）と cargo audit（既知の脆弱性があれば深刻度によらず落とす）で行う
    decision: npm audit --audit-level=high と cargo audit。RustSec の勧告には深刻度の無いものが多く High だけに絞れないので、Rust 側は既知の脆弱性すべてで落とす（000 の線より厳しい側）。保守されていない、取り下げられた、の知らせだけでは落とさない
  - id: TECH-fonts
    summary: 書体は、デザインシステムと同じものを Fontsource の npm パッケージでアプリに同梱する（今の案では Zen Maru Gothic と Nunito）。ネットにつながっていなくても同じ書体で出る
    decision: '@fontsource の各書体のパッケージを、使う太さだけ apps/desktop/src/main.tsx で読み込む。デザインシステムの tokens.css の @import は使わない'
  - id: TECH-wordbreak
    summary: 日本語の文の折り返しは、BudouX で文節の区切り（<wbr>）を入れて、Mac の画面（WebKit）でも文節で折り返す
    decision: budoux の日本語の解析器（loadDefaultJapaneseParser）で画面文を文節に分け、間に <wbr> を入れる。画面文を出す部品（apps/desktop/src/ui/Text.tsx）だけが区切りを入れる
    sources:
      - https://github.com/google/budoux/blob/main/javascript/README.md
  - id: TECH-clock
    summary: アプリの「今」（日付、時刻、時刻で変わる空の色）は、画面ではなく Rust の処理から受け取る。試す場では、起動のときの指定で時計を決められる
    decision: crates/core の時計（Clock）が今の時刻を返し、画面はコマンド now で受け取る。時刻と時間帯は jiff で扱う（Windows でも時間帯の表を同梱して同じに動く）。試す場は --clock <日時>（時間帯の無い日時はパソコンの時間帯の時刻）で時計を止めて起き、e2e では Asia/Tokyo の時間帯で動く
  - id: TECH-logging
    summary: 想定外の失敗の詳細は、パソコンの中の記録のファイルにだけ書き、画面には出さない
    decision: tracing と tracing-appender で、アプリのデータの置き場所の logs/ に日ごとのファイルで書く。試す場は標準エラーにも書く
  - id: TECH-shared-types
    summary: アプリと試す場とサーバーがやり取りするデータの形は Rust で定義し、TypeScript の型を生成して使う
    decision: crates/protocol に型を書き、ts-rs で packages/protocol/src/generated/ に TypeScript の型を出す（npm run gen）。typecheck の前に生成し、生成したものはコミットしない
  - id: TECH-ci
    summary: CI は GitHub Actions で、PR（向け先が main と aidd/**、下書きを除く）と main への push のたびに、Mac と Windows の GitHub の機械で、すべての検証と e2e を流す。非公開のリポジトリの無料の枠（月 12 ドル分）では 1 回あたり約 2 ドルかかり、月に 6 回ほどしか流せない見込みで足りない（足りない分の扱いは問い Q-003）
    decision: .github/workflows/ci.yml。検証のジョブ（Mac と Windows）と、e2e のジョブ（Mac と Windows それぞれで --shard を 2 つ）。Playwright の公式のコンテナは Linux だけなので使わない（Mac と Windows の機械では OS のパッケージを入れずにブラウザだけ入れられる）。見積もりは、Mac の機械が 1 分 0.062 ドル、Windows が 1 分 0.010 ドルで、1 回に Mac 約 25 分、Windows 約 30 分として出した
    sources:
      - https://docs.github.com/en/billing/concepts/product-billing/github-actions
  - id: TECH-release
    summary: 版の印（v で始まるタグ）を付けて送ったときだけ、Mac と Windows のアプリをビルドし、GitHub の下書きのリリースに置く。main へのマージでは何も起きない。署名はせず、新しい版は自分で入れ直す（自動のアップデートは一般に配るときに足す）
    decision: .github/workflows/release.yml（きっかけは push の tags 'v*' だけ）。tauri-apps/tauri-action で Mac（.dmg）と Windows（.msi と .exe）を作る。署名と公証、サーバーのデプロイは 008 で決める
