# specs/_current/_shared/rules.yaml：共通の要件。文と、あれば代表の具体例を 1 つ持つ
# 000 で書く共通の要件には、具体例を置かない。機能のチケットが、同じ種類の場面（返事が届かない、入れ忘れ、途中でやめる など）を
# 2 つ目の操作か領域で使うときに、その種類の共通の要件の下に代表の具体例を 1 つ置く（000 で書いたものにも足してよい）
# 操作の要件（REQ）は uses でこの要件を指し、同じ場面の具体例を操作ごとに書かない。テストは、指す操作ごとに代表の具体例の ID で書く
rules:
  - id: RULE-<name>
    statement: <要件の文>
    uses: []                      # この要件が頼る、ほかの base の項目（あれば）
    examples:                     # 代表の具体例（あれば 1 つ）。形は requirements.yaml の具体例と同じ
      - id: AC-<name>-1           # AC-<共通の要件の名前>-<番号>。テストの名前に _shared/AC-<name>-1 の形で入れる
        given: <前提。無ければ省く>
        when: <すること>
        then: <業務の結果>
