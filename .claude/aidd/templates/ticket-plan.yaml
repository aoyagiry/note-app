# specs/ticket-plan.yaml：機能のチケットの一覧。000 で作る。000 と 001 は書かない（順番はコアが決める）
# どのチケットも、自分の行と、まだ始めていないチケットの行を変えられる（後者は今あるものへの影響の一覧に出る）
tickets:
  - id: <NNN>-<name>
    title: <名前>
    purpose: <このチケットの目的。Gate 2 で照らす>
    scope:
      includes: [<含める操作>]
      excludes: [<含めないもの>]
    depends_on: []                # 先に main にマージするチケット（001 は書かない）
    # release: true               # 公開のチケット（作ったものを公開して、使う人が使い始めるチケット）だけ。足す役が付ける
later:                            # 後でチケットに切り出す範囲
  - id: <name>
    title: <名前>
    reason: <今は切り出さない理由>
